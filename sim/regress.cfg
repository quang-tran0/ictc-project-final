# FOCUSED REGRESSION:4 representative unresolved tests; not all150.
# Last complete baseline:seed1,107 Pass/43 Fail; base smoke passed separately.
# After UART monitor fixes:22 selected active reruns,15 Pass/7 Fail; base smoke
# passed again. Other128 cases retain baseline results and were not rerun.
# Independent VIP timing self-check PASS:399 sampled/789 decoded UART frames,
# 60 reference-slave AHB transfers. Four catcher guard runs failed as expected.
# Self-check top/commands:../testcases/uart_vip_check_top.sv (outside VPlan150).
# Enable another entry by removing the leading '#'; disable by adding '#'
# in COLUMN1 (required by the unchanged legacy regress.pl parser).
# Keep one run per selected case until a reproducer passes.
# For one test after compilation:make run TESTNAME=<name> COV=ON
# RUNARG="-dpicpppath /usr/bin/gcc". Rebuild only when source changes.
# Existing regress.pl ignores cov below; launch with COV=ON perl regress.pl.
# Native Makefile compatibility on Questa2021 (no Makefile edit):
# make build COV=ON --eval='build: VLOG += -suppress 14401'
# This suppresses only deprecated +acc=m, not any UVM/DUT checker error.
# To run the4 enabled cases through the unchanged regress.pl:
# COV=ON MAKEFLAGS='--eval=build:\ VLOG\ +=\ -suppress\ 14401' perl regress.pl
# Set UVM_HOME and UART_IP_VERIF_PATH/AHB_VIP_ROOT/UART_VIP_ROOT first.
# Legacy report scans every sim/log/*.log, including old/unselected cases.
# For focused debugging, read the selected test log and update only its VPlan
# row; do not infer current-batch results from stale aggregate log counts.
cov = on
pass_key_word = "TEST PASSED"
fail_key_word = "TEST FAILED"

